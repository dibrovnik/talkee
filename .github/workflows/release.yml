name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Tag to publish, for example v0.1.0"
        required: true

permissions:
  contents: write
  checks: read

jobs:
  verify-preflight:
    name: Verify release preflight
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require successful release preflight
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
        run: |
          set -euo pipefail

          git fetch --tags --force
          target_sha="$(git rev-list -n 1 "$RELEASE_REF")"
          echo "Checking Release Preflight checks for ${RELEASE_REF} (${target_sha})"

          checks_json="$(curl -fsSL \
            -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/commits/${target_sha}/check-runs?per_page=100")"

          missing=0
          for check_name in "Preflight macos"; do
            conclusion="$(jq -r --arg name "$check_name" '[.check_runs[] | select(.name == $name)] | sort_by(.completed_at // "") | last | .conclusion // ""' <<< "$checks_json")"

            if [[ "$conclusion" != "success" ]]; then
              echo "::error title=Release preflight missing::${check_name} must be successful on ${target_sha} before publishing a release tag. Current conclusion: ${conclusion:-missing}."
              missing=1
            else
              echo "${check_name}: success"
            fi
          done

          if [[ "$missing" != "0" ]]; then
            echo "Run the Release Preflight workflow on the release branch and do not push a release tag until the macOS check passes."
            exit 1
          fi

  build:
    name: Build macos
    needs: verify-preflight
    runs-on: macos-latest

    env:
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      TALKEE_STT_RELEASE: "1"
      TALKEE_SKIP_BEFORE_BUILD: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.13

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Rust build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run release checks
        run: bun run check:release

      - name: Build bundles
        run: bun run tauri build --bundles app

      - name: Postprocess macOS release
        run: bun run postprocess:macos-release

      - name: Archive macOS app bundle
        run: ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/release/bundle/macos/Talkee.app" "Talkee-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}-macos.zip"

      - name: Upload release bundle
        uses: actions/upload-artifact@v4
        with:
          name: talkee-macos-release
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            Talkee-*-macos.zip
          if-no-files-found: error

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-22.04
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download release bundles
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Prepare stable download assets
        run: |
          set -euo pipefail

          STABLE_DIR="release-artifacts/stable-downloads"
          mkdir -p "$STABLE_DIR"

          copy_first() {
            local pattern="$1"
            local target="$2"
            local source

            source="$(find release-artifacts -type f -name "$pattern" ! -path "$STABLE_DIR/*" -print -quit)"
            if [[ -z "$source" ]]; then
              echo "Missing release asset matching $pattern" >&2
              exit 1
            fi

            cp "$source" "$STABLE_DIR/$target"
            echo "Prepared $target from $source"
          }

          copy_first "*.dmg" "Talkee-macos.dmg"

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Talkee ${{ env.RELEASE_TAG }}
          body: |
            Automated release for ${{ env.RELEASE_TAG }}.

            This release publishes the native macOS (Apple Silicon) Tauri bundles built on the macOS runner.

            ### Первый запуск / First launch

            Сборки пока без платной подписи кода — это **не вирус** (исходники открыты, AGPL-3.0). Если macOS блокирует запуск:
            The builds are not code-signed yet — this is **not malware** (open source, AGPL-3.0). If macOS blocks it:

            - **macOS** — «не удалось проверить» / "could not verify": нажмите **Готово/Done**, затем **Системные настройки → Конфиденциальность и безопасность → Всё равно открыть** (System Settings → Privacy & Security → Open Anyway). Или: `xattr -dr com.apple.quarantine /Applications/Talkee.app`
          draft: false
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          files: |
            release-artifacts/**/*.dmg
            release-artifacts/**/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
