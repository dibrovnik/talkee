[package]
name = "talkee"
version = "0.4.10"
description = "Talkee - Voice to Text Desktop Widget"
authors = ["trixter"]
license = "AGPL-3.0-or-later"
edition = "2021"
default-run = "talkee"

[lints]
workspace = true

[workspace]
members = ["sidecars/talkee-llm"]
default-members = ["."]
resolver = "2"

[workspace.package]
version = "0.4.10"
edition = "2021"
license = "AGPL-3.0-or-later"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[lib]
name = "talkee_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart", "blocking"] }
futures-util = "0.3"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
cpal = "0.15.3"
dirs = "5"
include_dir = "0.7"
libc = "0.2"
url = "2.5.8"
tauri-plugin-process = "2.3.1"
tauri-plugin-shell = "2.3.2"
transcribe-cpp = { version = "0.1.1", default-features = false, features = ["metal"] }
hound = "3.5.1"
tauri-plugin-dialog = "2"
handy-keys = "0.2.4"
ct2rs = { version = "0.9.19", default-features = false, features = ["all-tokenizers", "accelerate"] }
tauri-plugin-autostart = "2.5.1"
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSView", "NSWindow", "NSEvent", "NSScreen", "NSGraphics", "NSApplication", "block2"] }
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray", "CFDictionary", "CFNumber", "CFString"] }
objc2-foundation = { version = "0.3", features = ["NSProcessInfo", "NSString", "NSNotification", "NSOperation", "block2"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false
