name: Release Preflight

on:
  push:
    branches:
      - "release/v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release version being checked, for example v0.3.12"
        required: true

permissions:
  contents: read

concurrency:
  group: release-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Preflight macos
    runs-on: macos-14

    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      TALKEE_STT_RELEASE: "1"
      TALKEE_SKIP_BEFORE_BUILD: "1"
      TALKEE_TARGET_CPU: "apple-m1"
      RUSTFLAGS: "-C target-cpu=apple-m1"
      TALKEE_DEV_SIGNING_IDENTITY: "-"
      RELEASE_LABEL: ${{ github.event.inputs.release_tag || github.ref_name }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.13

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache Rust build output
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/git
            ~/.cargo/registry
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run quality gate
        run: bun run gate

      - name: Build bundles
        run: bun run build:release:macos

      - name: Archive macOS app bundle
        run: |
          SAFE_RELEASE_LABEL="${RELEASE_LABEL//\//-}"
          ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/release/bundle/macos/Talkee.app" "Talkee-${SAFE_RELEASE_LABEL}-macos.zip"

      - name: Upload preflight bundle
        uses: actions/upload-artifact@v4
        with:
          name: talkee-macos-preflight
          retention-days: 3
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            Talkee-*-macos.zip
          if-no-files-found: error
